career-profile:
  title: Career Profile
  summary: |
    Born in 1997 in İzmir, I graduated from Ege University with a degree in Statistics. I aim to specialize in computer technologies, coding, and game/graphics engines. I have an excellent command of English. I completed my military service as a Second/Lieutenant at the Cengiz Topel Naval Air Forces Command. I hold a Class B driver’s license.
education:
  title: Education
  info:
  - degree: B.Sc. in Statistics
    university: Ege University
    time: 2017 - 2022
    details: |
      Studied statistical theory, data analysis, probability, regression modeling, and applied mathematics. Developed strong analytical and problem-solving skills, gained experience with statistical software (R, Python, C#, SPSS, Matlab), and worked on practical projects involving data optimization, visualization, and interpretation.
      - Worked on team-based assignments focused on real-world data sets.
      - Utilized optimization techniques to solve statistical and operational problems.
  - degree: AA in Computer Programming
    university: Anatolia University
    time: 2023 - Present 
    details: |
     Currently studying core principles of computer programming, software development, and database management. Gaining foundational skills in programming languages and algorithmic problem solving.
      - Improving analytical thinking and troubleshooting abilities.
      - Studying database design, SQL, and data management concepts.
  

